<title>Lemonade Stand</title>
<style>
/* Lemonade Stand — mobile-first, thumb-friendly, no framework. */

:root {
  color-scheme: light dark;
  --bg: #fff8e6;
  --bg-2: #ffffff;
  --ink: #2b2417;
  --ink-soft: #6d6250;
  --line: #e6d9b8;
  --lemon: #f7c948;
  --lemon-deep: #e0a800;
  --leaf: #4a9d54;
  --sky: #64b5e8;
  --danger: #d8503c;
  --shadow: 0 2px 0 rgba(0, 0, 0, .06), 0 8px 24px rgba(120, 90, 20, .1);
  --radius: 18px;
  --tap: 48px;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #191510;
    --bg-2: #241e17;
    --ink: #f5ecd9;
    --ink-soft: #b3a58c;
    --line: #3a3126;
    --shadow: 0 2px 0 rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .35);
  }
}
:root[data-theme="dark"] {
  --bg: #191510;
  --bg-2: #241e17;
  --ink: #f5ecd9;
  --ink-soft: #b3a58c;
  --line: #3a3126;
  --shadow: 0 2px 0 rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .35);
}

* { box-sizing: border-box; }

/* An element's own `display` (e.g. .hud, .actions) would otherwise outrank
   the browser's default [hidden] rule and stay visible. */
[hidden] { display: none !important; }

html, body {
  margin: 0;
  height: 100%;
  overscroll-behavior: none;
}

body {
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.45 ui-rounded, "SF Pro Rounded", "Segoe UI", system-ui, -apple-system, sans-serif;
  -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%;
}

.app {
  display: flex;
  flex-direction: column;
  min-height: 100%;
  max-width: 560px;
  margin: 0 auto;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
}

/* ---------- HUD ---------- */

.hud {
  position: sticky;
  top: 0;
  z-index: 5;
  display: flex;
  gap: 10px;
  align-items: center;
  padding: 10px 16px;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}

.hud-item { display: flex; flex-direction: column; gap: 2px; }
.hud-rep { margin-left: auto; align-items: flex-end; }
.hud-label { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); }
.hud-value { font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums; }

.meter {
  display: block;
  width: 84px;
  height: 10px;
  border-radius: 99px;
  background: var(--line);
  overflow: hidden;
}
.meter i {
  display: block;
  height: 100%;
  width: 50%;
  border-radius: 99px;
  background: linear-gradient(90deg, var(--lemon-deep), var(--lemon));
  transition: width .5s ease;
}

/* ---------- Layout ---------- */

.screen {
  flex: 1;
  padding: 16px 16px 8px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  animation: rise .28s ease both;
}

@keyframes rise {
  from { opacity: 0; transform: translateY(8px); }
}

.actions {
  position: sticky;
  bottom: 0;
  padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
  background: linear-gradient(to top, var(--bg) 65%, transparent);
  display: grid;
  gap: 8px;
}

.card {
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px;
  box-shadow: var(--shadow);
}

.card h2 {
  margin: 0 0 12px;
  font-size: 13px;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--ink-soft);
}

h1 { font-size: 26px; margin: 0 0 4px; letter-spacing: -.01em; }
p { margin: 0 0 10px; }
p:last-child { margin-bottom: 0; }
.muted { color: var(--ink-soft); font-size: 14px; }
.center { text-align: center; }

/* ---------- Buttons ---------- */

button {
  font: inherit;
  color: inherit;
  border: 0;
  background: none;
  cursor: pointer;
  touch-action: manipulation;
}

.btn {
  min-height: 54px;
  width: 100%;
  border-radius: 16px;
  background: linear-gradient(180deg, var(--lemon), var(--lemon-deep));
  color: #33270a;
  font-size: 18px;
  font-weight: 800;
  letter-spacing: .01em;
  box-shadow: 0 3px 0 #b98a00, var(--shadow);
  transition: transform .06s ease, box-shadow .06s ease;
}
.btn:active { transform: translateY(3px); box-shadow: 0 0 0 #b98a00, var(--shadow); }
.btn[disabled] { opacity: .5; box-shadow: none; }

.btn-ghost {
  min-height: 48px;
  width: 100%;
  border-radius: 14px;
  border: 1px solid var(--line);
  background: var(--bg-2);
  font-weight: 600;
  color: var(--ink-soft);
  box-shadow: none;
}

.chip-row { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  min-height: 40px;
  padding: 0 14px;
  border-radius: 99px;
  border: 1px solid var(--line);
  background: var(--bg);
  font-size: 14px;
  font-weight: 600;
}
.chip:active { background: var(--lemon); }

/* ---------- Weather ---------- */

.weather {
  display: flex;
  align-items: center;
  gap: 14px;
}
.weather-icon { font-size: 52px; line-height: 1; }
.weather-main { flex: 1; }
.weather-temp { font-size: 34px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.weather-label { color: var(--ink-soft); font-weight: 600; }

.headline {
  margin-top: 12px;
  padding: 12px 14px;
  border-radius: 14px;
  background: color-mix(in srgb, var(--sky) 16%, var(--bg-2));
  border: 1px solid color-mix(in srgb, var(--sky) 35%, var(--line));
  font-size: 15px;
}

/* ---------- Steppers ---------- */

.row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 0;
  border-bottom: 1px solid var(--line);
}
.row:last-child { border-bottom: 0; padding-bottom: 0; }
.row-main { flex: 1; min-width: 0; }
.row-name { font-weight: 700; }
.row-sub { font-size: 13px; color: var(--ink-soft); }

.stepper {
  display: flex;
  align-items: center;
  gap: 4px;
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 4px;
}
.stepper button {
  width: var(--tap);
  height: 40px;
  border-radius: 10px;
  font-size: 22px;
  font-weight: 700;
  color: var(--ink);
  background: var(--bg-2);
  border: 1px solid var(--line);
}
.stepper button:active { background: var(--lemon); }
.stepper button[disabled] { opacity: .35; }
.stepper output {
  min-width: 52px;
  text-align: center;
  font-weight: 800;
  font-size: 17px;
  font-variant-numeric: tabular-nums;
}

.total {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-top: 14px;
  padding-top: 12px;
  border-top: 2px dashed var(--line);
  font-size: 17px;
  font-weight: 700;
}
.total .over { color: var(--danger); }

/* ---------- Facts / report ---------- */

.facts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.fact {
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 10px 12px;
}
.fact-label { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-soft); }
.fact-value { font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; }
.fact-value.good { color: var(--leaf); }
.fact-value.bad { color: var(--danger); }

.notes { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 8px; }
.notes li {
  background: var(--bg);
  border: 1px solid var(--line);
  border-left: 4px solid var(--lemon);
  border-radius: 10px;
  padding: 9px 12px;
  font-size: 14px;
}

/* ---------- Open-for-business animation ---------- */

.stand { text-align: center; padding: 8px 0 4px; }
.stand-count { font-size: 64px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.stand-count small { display: block; font-size: 14px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); }
.queue { font-size: 30px; min-height: 44px; letter-spacing: 2px; word-break: break-all; }
.queue span { display: inline-block; animation: pop .4s ease both; }
@keyframes pop {
  from { opacity: 0; transform: scale(.4) translateY(6px); }
  60% { transform: scale(1.15); }
}
.till { font-size: 22px; font-weight: 800; color: var(--leaf); font-variant-numeric: tabular-nums; }

.progress {
  height: 8px;
  border-radius: 99px;
  background: var(--line);
  overflow: hidden;
  margin-top: 12px;
}
.progress i {
  display: block;
  height: 100%;
  width: 0;
  background: var(--lemon-deep);
}

/* ---------- Season chart ---------- */

/* Daily profit, drawn above and below a zero line. */
.chart {
  display: flex;
  gap: 3px;
  height: 96px;
  margin-top: 16px;
}
.chart-col { flex: 1; display: flex; flex-direction: column; }
.chart-pos { flex: 1; display: flex; align-items: flex-end; }
.chart-neg { flex: 1; display: flex; align-items: flex-start; border-top: 1px solid var(--line); }
.chart i { width: 100%; display: block; }
.chart-pos i { background: var(--leaf); border-radius: 3px 3px 0 0; }
.chart-neg i { background: var(--danger); border-radius: 0 0 3px 3px; }

.rank { text-align: center; padding: 6px 0 2px; }
.rank-icon { font-size: 56px; line-height: 1; }
.rank-title { font-size: 24px; font-weight: 800; margin-top: 4px; }

.title-art { font-size: 72px; text-align: center; line-height: 1; margin: 8px 0 0; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

/* ================================================================
   Campaign: map, cities, corners, operations
   ================================================================ */

.head-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.head-row h1 { margin: 0; }

.treasury {
  text-align: right;
  font-size: 22px;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  line-height: 1.1;
}
.treasury small {
  display: block;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--ink-soft);
}

h1 .of { font-size: 15px; font-weight: 600; color: var(--ink-soft); }

.crumb {
  align-self: flex-start;
  min-height: 40px;
  padding: 0 14px 0 8px;
  margin-bottom: -4px;
  border-radius: 12px;
  font-weight: 700;
  color: var(--ink-soft);
}
.crumb:active { background: var(--line); }

/* ---- lists of places ---- */

.city-list, .corner-list { display: grid; gap: 8px; }

.city, .corner {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  text-align: left;
  padding: 12px 14px;
  border: 1px solid var(--line);
  border-radius: 16px;
  background: var(--bg-2);
  box-shadow: var(--shadow);
}
.city:active, .corner.open:active { transform: translateY(1px); background: var(--lemon); }
.city.locked, .corner.locked { opacity: .5; box-shadow: none; background: transparent; }
.city.done { border-color: var(--leaf); }

.city-flag { font-size: 30px; line-height: 1; }
.city-main, .corner-main { flex: 1; min-width: 0; }
.city-name, .corner-name {
  font-weight: 700;
  font-size: 16px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.city-count, .corner-target {
  text-align: right;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  line-height: 1.1;
}
.city-count small, .corner-target small {
  display: block;
  font-size: 10px;
  font-weight: 600;
  color: var(--ink-soft);
  text-transform: uppercase;
  letter-spacing: .06em;
}

.corner-no {
  width: 34px;
  height: 34px;
  flex: 0 0 34px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: var(--bg);
  border: 1px solid var(--line);
  font-weight: 800;
  font-size: 14px;
}
.corner.claimed { background: color-mix(in srgb, var(--leaf) 12%, var(--bg-2)); border-color: color-mix(in srgb, var(--leaf) 35%, var(--line)); }
.corner.claimed .corner-no { background: var(--leaf); color: #fff; border-color: var(--leaf); }
.tick { color: var(--leaf); }

/* ---- difficulty pills ---- */

.pill {
  display: inline-block;
  padding: 2px 9px;
  border-radius: 99px;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: .02em;
  border: 1px solid transparent;
}
.pill-easy { background: color-mix(in srgb, var(--leaf) 18%, transparent); color: var(--leaf); border-color: color-mix(in srgb, var(--leaf) 35%, transparent); }
.pill-medium { background: color-mix(in srgb, var(--lemon-deep) 20%, transparent); color: var(--lemon-deep); border-color: color-mix(in srgb, var(--lemon-deep) 40%, transparent); }
.pill-hard { background: color-mix(in srgb, #e08c3c 22%, transparent); color: #c9711f; border-color: color-mix(in srgb, #e08c3c 40%, transparent); }
.pill-impossible { background: color-mix(in srgb, var(--danger) 18%, transparent); color: var(--danger); border-color: color-mix(in srgb, var(--danger) 40%, transparent); }

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .pill-hard { color: #f0a75c; }
  :root:not([data-theme="light"]) .pill-medium { color: var(--lemon); }
}
:root[data-theme="dark"] .pill-hard { color: #f0a75c; }
:root[data-theme="dark"] .pill-medium { color: var(--lemon); }

/* ---- meters ---- */

.bar {
  display: block;
  height: 8px;
  margin-top: 8px;
  border-radius: 99px;
  background: var(--line);
  overflow: hidden;
}
.bar i {
  display: block;
  height: 100%;
  border-radius: 99px;
  background: linear-gradient(90deg, var(--lemon-deep), var(--lemon));
  transition: width .4s ease;
}
.bar-win i { background: linear-gradient(90deg, #3f8f4a, var(--leaf)); }
.bar-warn i { background: linear-gradient(90deg, #c2452f, var(--danger)); }

.hud-goal { flex: 0 1 130px; min-width: 96px; margin-left: auto; align-items: stretch; }
.hud-goal .bar { margin-top: 4px; }

/* ---- notices ---- */

.notice, .locked-note, .warn, .warn-card {
  border-radius: 14px;
  font-size: 14px;
}
.notice {
  padding: 12px 14px;
  background: color-mix(in srgb, var(--danger) 12%, var(--bg-2));
  border: 1px solid color-mix(in srgb, var(--danger) 35%, var(--line));
}
.locked-note {
  padding: 12px 14px;
  text-align: center;
  color: var(--ink-soft);
  background: var(--bg-2);
  border: 1px dashed var(--line);
}
.warn { color: var(--danger); }
.warn-card { border-color: color-mix(in srgb, var(--danger) 35%, var(--line)); }
.warn-dot { font-size: 13px; }
.ops-report { border-color: color-mix(in srgb, var(--leaf) 35%, var(--line)); }
.good { color: var(--leaf); }
.bad { color: var(--danger); }

.challenge h2 { color: var(--ink); font-size: 16px; letter-spacing: 0; text-transform: none; }

.chip-on {
  background: var(--leaf);
  border-color: var(--leaf);
  color: #fff;
}

.subtotal { border: 0; padding-top: 4px; margin-top: 0; font-size: 14px; font-weight: 600; }

/* ---- inline text links (a stepping-stone into a bigger screen) ---- */

.link-btn {
  display: inline;
  padding: 0;
  border: 0;
  background: none;
  color: var(--lemon-deep);
  font-weight: 700;
  font-size: inherit;
  text-decoration: underline;
  text-underline-offset: 2px;
}
.link-btn:active { opacity: 0.7; }

@media (prefers-color-scheme: dark) {
  .link-btn { color: var(--lemon); }
}

/* ---- the one paywall in the game ---- */

.paywall {
  text-align: center;
  border-color: color-mix(in srgb, var(--lemon-deep) 40%, var(--line));
  background: color-mix(in srgb, var(--lemon) 10%, var(--bg-2));
}
.paywall-price {
  font-size: 34px;
  font-weight: 800;
  margin-bottom: 10px;
}
.paywall-price small {
  display: block;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--ink-soft);
}
.paywall p { text-align: left; }

/* ---- locked list rows (achievements, and anywhere else that fits) ---- */

.row.locked { opacity: .5; }
.row.locked .row-name { color: var(--ink-soft); }

/* ---- tutorial slides ---- */

.tut-slide {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  gap: 6px;
  padding: 24px 12px;
}
.tut-icon { font-size: 72px; line-height: 1; margin-bottom: 8px; }
.tut-slide h1 { font-size: 24px; margin: 0; }
.tut-slide p { max-width: 34ch; color: var(--ink-soft); font-size: 16px; line-height: 1.5; }

.tut-dots {
  display: flex;
  justify-content: center;
  gap: 8px;
  padding-bottom: 8px;
}
.tut-dot {
  width: 8px;
  height: 8px;
  border-radius: 99px;
  background: var(--line);
}
.tut-dot.on { background: var(--lemon-deep); width: 22px; }

/* Reserve room so the fixed preview bar never covers the game's own
   sticky action buttons or the tail end of an unpadded screen. */
.screen { padding-bottom: 60px; }
.actions { padding-bottom: calc(60px + env(safe-area-inset-bottom)); }
.preview-banner {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  z-index: 50;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  font-size: 11px;
  letter-spacing: .03em;
  color: var(--ink-soft);
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(6px);
  padding: 7px 12px max(7px, env(safe-area-inset-bottom)) 14px;
  border-top: 1px solid var(--line);
}
.preview-banner > span { flex: 0 0 auto; }
#preview-ops-jump {
  flex: 0 0 auto;
  min-height: 30px;
  padding: 0 12px;
  border-radius: 99px;
  font-size: 12px;
  font-weight: 700;
  color: #33270a;
  background: linear-gradient(180deg, var(--lemon), var(--lemon-deep));
  border: 1px solid color-mix(in srgb, var(--lemon-deep) 60%, transparent);
}
#preview-ops-jump:active { transform: translateY(1px); }
</style>

</div>

 * on schedule, an `enhancers` sub-order tops up enhancer stock, and the rest
 * (sugar, ice, cups) adds straight in.
 */
function receiveOrder(state, order) {
  for (const key of Object.keys(order)) {
    if (key === 'lemons') {
      receiveLemons(state, order.lemons || 0);
    } else if (key === 'enhancers') {
      for (const [id, qty] of Object.entries(order.enhancers || {})) {
        state.inventory.enhancers[id] = (state.inventory.enhancers[id] || 0) + (qty || 0);
      }
    } else {
      state.inventory[key] = (state.inventory[key] || 0) + (order[key] || 0);
    }
  }
}

/** Use the oldest lemons first, so the freshest batch is the one left to spoil last. */
function consumeLemons(state, qty) {
  let remaining = qty;
  const batches = state.inventory.lemonBatches || [];
  while (remaining > 0 && batches.length) {
    const take = Math.min(remaining, batches[0].qty);
    batches[0].qty -= take;
    remaining -= take;
    if (batches[0].qty <= 0) batches.shift();
  }
  state.inventory.lemons = Math.max(0, state.inventory.lemons - qty);
}

/**
 * Discard any batch older than the shelf life, as of the current day. A
 * never-expire unlock skips this entirely — the one thing real money buys.
 */
function spoilLemons(state) {
  if (state.premium?.neverExpireLemons) return 0;
  const batches = state.inventory.lemonBatches || [];
  let spoiled = 0;
  const fresh = [];
  for (const b of batches) {
    if (state.day - b.day >= LEMON_SHELF_LIFE_DAYS) spoiled += b.qty;
    else fresh.push(b);
  }
  state.inventory.lemonBatches = fresh;
  if (spoiled > 0) state.inventory.lemons = Math.max(0, state.inventory.lemons - spoiled);
  return spoiled;
}

/** How many days the oldest lemon in the cooler has left before it spoils. */
function daysUntilLemonsSpoil(state) {
  const batches = state.inventory.lemonBatches || [];
  if (!batches.length) return null;
  const age = state.day - batches[0].day;
  return Math.max(0, LEMON_SHELF_LIFE_DAYS - age);
}

/* ------------------------------------------------------------------ *
 * Enhancers — optional add-ins customers can pay extra for
 * ------------------------------------------------------------------ */

const ENHANCERS = {
  strawberry: { id: 'strawberry', label: 'Strawberry Splash', icon: '🍓', addPrice: 0.35, unitCost: 0.16, appeal: 1.0 },
  mango:      { id: 'mango',      label: 'Mango Twist',       icon: '🥭', addPrice: 0.4,  unitCost: 0.2,  appeal: 0.9 },
  mint:       { id: 'mint',       label: 'Mint Cooler',       icon: '🌿', addPrice: 0.3,  unitCost: 0.12, appeal: 1.0, coolant: true },
  caffeine:   { id: 'caffeine',   label: 'Caffeine Kick',     icon: '☕', addPrice: 0.55, unitCost: 0.24, appeal: 0.75 },
};

const emptyEnhancerInventory = () =>
  Object.fromEntries(Object.keys(ENHANCERS).map((id) => [id, 0]));
const allEnhancersOff = () =>
  Object.fromEntries(Object.keys(ENHANCERS).map((id) => [id, false]));

/** How likely a customer who is already buying is to add this enhancer too. */
function enhancerUptake(enh, heat) {
  let chance = 0.55 * enh.appeal - 0.4 * enh.addPrice;
  if (enh.coolant) chance *= 1 + heat * 0.35; // a cool add-on sells better when it's hot
  return clamp(chance, 0, 0.9);
}

const WEATHER = {
  scorcher:  { id: 'scorcher',  label: 'Scorcher',      icon: '🔥', traffic: 1.35, tempRange: [92, 104], hot: true },
  sunny:     { id: 'sunny',     label: 'Sunny',         icon: '☀️', traffic: 1.15, tempRange: [76, 92], hot: true },
  fair:      { id: 'fair',      label: 'Fair',          icon: '🌤️', traffic: 1.0,  tempRange: [68, 82] },
  cloudy:    { id: 'cloudy',    label: 'Cloudy',        icon: '☁️', traffic: 0.82, tempRange: [60, 74] },
  drizzle:   { id: 'drizzle',   label: 'Drizzle',       icon: '🌦️', traffic: 0.5,  tempRange: [55, 70], wet: true },
  storm:     { id: 'storm',     label: 'Thunderstorms', icon: '⛈️', traffic: 0.22, tempRange: [52, 68], wet: true },
};

// Rough seasonal drift: the run warms up as its days pass.
function pickWeather(rng, day, days, mods) {
  const warmth = day / Math.max(1, days); // 0 → 1
  const weights = [
    [WEATHER.scorcher, (0.04 + 0.22 * warmth) * mods.hotBias],
    [WEATHER.sunny,    (0.24 + 0.12 * warmth) * mods.hotBias],
    [WEATHER.fair,     0.28],
    [WEATHER.cloudy,   0.22 - 0.08 * warmth],
    [WEATHER.drizzle,  (0.14 - 0.06 * warmth) * mods.wetBias],
    [WEATHER.storm,    (0.08 - 0.04 * warmth) * mods.wetBias],
  ].filter(([, w]) => w > 0);
  const total = weights.reduce((s, [, w]) => s + w, 0);
  let roll = rng() * total;
  for (const [w, weight] of weights) {
    roll -= weight;
    if (roll <= 0) return w;
  }
  return WEATHER.fair;
}

function pickTemp(rng, weather, mods) {
  const [lo, hi] = weather.tempRange;
  return Math.round(lo + rng() * (hi - lo) + mods.tempShift);
}

const EVENTS = [
  { id: 'fair',      text: 'A street fair is setting up down the block!', traffic: 1.7,  chance: 0.06 },
  { id: 'parade',    text: 'The summer parade marches right past you.',   traffic: 1.55, chance: 0.05 },
  { id: 'heatwave',  text: 'Heat advisory — everyone is desperate for something cold.', traffic: 1.4, chance: 0.06 },
  { id: 'roadwork',  text: 'Road crews closed the street. Hardly anyone walks by.', traffic: 0.45, chance: 0.06 },
  { id: 'rival',     text: 'A kid opened a rival stand on the next corner.', traffic: 0.65, chance: 0.07 },
  { id: 'icetruck',  text: 'The ice truck broke down — ice cost double today.', traffic: 1.0, chance: 0.05, icePrice: 2.0 },
  { id: 'lemonglut', text: 'A lemon truck spilled its load. Lemons are cheap!', traffic: 1.0, chance: 0.05, lemonPrice: 0.55 },
  { id: 'schooltrip',text: 'A school bus unloaded a field trip nearby.',    traffic: 1.35, chance: 0.05 },
];

function pickEvent(rng, mods) {
  for (const ev of EVENTS) {
    if (rng() < ev.chance * mods.eventChance) return ev;
  }
  return null;
}

/** Supply prices wobble a little day to day, then events adjust them. */
function rollPrices(rng, event, mods) {
  const jitter = (base, spread) => round2(base * (1 - spread + rng() * spread * 2));
  const prices = {
    lemon: jitter(0.38 * mods.lemonPrice, 0.25),  // each
    sugar: jitter(0.3 * mods.sugarPrice, 0.2),    // one cup of sugar
    ice: jitter(0.05 * mods.icePrice, 0.3),       // one cube
    cup: jitter(0.09 * mods.cupPrice, 0.15),      // one paper cup
  };
  if (event?.lemonPrice) prices.lemon = round2(prices.lemon * event.lemonPrice);
  if (event?.icePrice) prices.ice = round2(prices.ice * event.icePrice);
  return prices;
}

/** How much ice a customer expects per cup at this temperature. */
function idealIcePerCup(temp, mods = NO_MODS) {
  return clamp(Math.round((temp - 52) / 12) + (mods.iceExtra || 0), 0, 7);
}

/** Bell curve around a target: 1.0 when perfect, tailing off as you drift. */
function scoreAgainst(value, ideal, tolerance) {
  const dev = (value - ideal) / tolerance;
  return Math.exp(-dev * dev);
}

/**
 * How good the lemonade tastes, 0..1, given the recipe and the weather.
 * Weak or sour drinks and warm cups on a hot day all land here.
 */
function recipeQuality(recipe, temp, mods = NO_MODS) {
  const t = (base) => base / mods.strictness;
  const lemonScore = scoreAgainst(recipe.lemons, IDEAL_LEMONS, t(2.6));
  const sugarScore = scoreAgainst(recipe.sugar, IDEAL_SUGAR, t(2.6));
  const iceScore = scoreAgainst(recipe.ice, idealIcePerCup(temp, mods), t(1.9));
  return clamp(0.4 * lemonScore + 0.32 * sugarScore + 0.28 * iceScore, 0, 1);
}

/** Cost of the ingredients in a single cup, at today's prices. */
function costPerCup(recipe, prices) {
  const perPitcher = recipe.lemons * prices.lemon + recipe.sugar * prices.sugar;
  return round2(perPitcher / CUPS_PER_PITCHER + recipe.ice * prices.ice + prices.cup);
}

/** Most cups you can pour with what's in the cooler right now. */
function maxCupsAvailable(inventory, recipe) {
  const byLemons = Math.floor(inventory.lemons / Math.max(1, recipe.lemons));
  const bySugar = Math.floor(inventory.sugar / Math.max(1, recipe.sugar));
  const pitchers = Math.min(byLemons, bySugar);
  const byIce = recipe.ice > 0 ? Math.floor(inventory.ice / recipe.ice) : Infinity;
  return Math.max(0, Math.min(pitchers * CUPS_PER_PITCHER, byIce, inventory.cups));
}

/**
 * What the crowd grumbled about today. Deliberately qualitative — the player
 * dials in the recipe from these hints rather than reading a target number.
 */
function customerNotes(recipe, temp, result, mods = NO_MODS) {
  const gripes = [];
  const iceIdeal = idealIcePerCup(temp, mods);
  const push = (weight, text) => gripes.push({ weight, text });

  if (recipe.lemons <= IDEAL_LEMONS - 2) push(IDEAL_LEMONS - recipe.lemons, 'Tastes like lemon-flavoured water.');
  if (recipe.lemons >= IDEAL_LEMONS + 2) push(recipe.lemons - IDEAL_LEMONS, 'Way too sour — my mouth is puckering.');
  if (recipe.sugar <= IDEAL_SUGAR - 2) push(IDEAL_SUGAR - recipe.sugar, 'Not sweet enough for me.');
  if (recipe.sugar >= IDEAL_SUGAR + 2) push(recipe.sugar - IDEAL_SUGAR, 'Syrupy. My teeth hurt.');
  if (recipe.ice <= iceIdeal - 1) push((iceIdeal - recipe.ice) * 1.5, temp >= 85 ? 'This is warm on a day like today!' : 'Could use a bit more ice.');
  if (recipe.ice >= iceIdeal + 2) push(recipe.ice - iceIdeal, 'Mostly ice cubes. Where is the lemonade?');

  gripes.sort((a, b) => b.weight - a.weight);
  const notes = gripes.slice(0, 2).map((g) => g.text);

  if (result) {
    if (result.stock === 0) {
      return ['You had nothing to pour, so the stand stayed shut.'];
    }
    if (result.potential > 0 && result.interested / result.potential < 0.35 && result.price > 0.75) {
      notes.push('Plenty of people looked, then balked at the price.');
    }
    if (result.lostToStockout > 0) {
      notes.push(`You sold out — ${result.lostToStockout} customer${result.lostToStockout === 1 ? '' : 's'} left empty-handed.`);
    }
  }
  if (notes.length === 0) notes.push('Best lemonade on the block!');
  return notes;
}

/**
 * Start a run. `days` and `stake` set the shape of it; `target` is the profit
 * you have to clear to claim the corner (null for free play).
 */
function newRun({
  seed = Math.floor(Math.random() * 1e9),
  days = TOTAL_DAYS,
  stake = STARTING_MONEY,
  target = null,
  mods = null,
  corner = null,
  premium = null,
} = {}) {
  const state = {
    seed,
    day: 1,
    days,
    stake,
    target,
    corner,               // { cityId, index, name } when played from the campaign
    mods: withMods(mods),
    premium: { neverExpireLemons: false, ...(premium || {}) },
    money: stake,
    reputation: 0.5,
    inventory: { lemons: 0, sugar: 0, ice: 0, cups: 0, lemonBatches: [], enhancers: emptyEnhancerInventory() },
    enhancersOffered: allEnhancersOff(),
    recipe: { lemons: 5, sugar: 5, ice: 2 },
    price: 0.5,
    history: [],
    today: null,
    phase: 'forecast',
  };
  state.today = rollDay(state);
  return state;
}

/** Free play: the original thirty-day season with nothing stacked against you. */
function newGame(seed = Math.floor(Math.random() * 1e9)) {
  return newRun({ seed });
}

/** Weather, headlines and supply prices for the day about to start. */
function rollDay(state) {
  const mods = withMods(state.mods);
  const rng = mulberry32(state.seed + state.day * 7919);
  const weather = pickWeather(rng, state.day, state.days ?? TOTAL_DAYS, mods);
  const temp = pickTemp(rng, weather, mods);
  const event = pickEvent(rng, mods);
  return {
    weather: weather.id,
    temp,
    event: event ? { id: event.id, text: event.text } : null,
    prices: rollPrices(rng, event, mods),
    trafficMod: (event?.traffic ?? 1) * weather.traffic * mods.traffic,
  };
}

function buyCost(prices, order) {
  return round2(
    order.lemons * prices.lemon +
    order.sugar * prices.sugar +
    order.ice * prices.ice +
    order.cups * prices.cup
  );
}

/** Enhancer stock has a fixed wholesale price — no daily jitter, no bulk break. */
function enhancerOrderCost(order) {
  return round2(
    Object.entries(order || {}).reduce((sum, [id, qty]) => sum + (ENHANCERS[id]?.unitCost || 0) * (qty || 0), 0)
  );
}

/**
 * Run the day. Walks every potential customer past the stand and asks
 * whether they'd pay your price for what you're pouring.
 */
function simulateDay(state) {
  const today = state.today;
  const mods = withMods(state.mods);
  const rng = mulberry32(state.seed + state.day * 104729 + 17);
  const quality = recipeQuality(state.recipe, today.temp, mods);

  // Thirst climbs steeply once it gets hot.
  const heat = clamp((today.temp - 48) / 46, 0, 1);
  const thirst = 0.35 + 1.25 * heat * heat;
  const repFactor = 0.45 + 1.1 * state.reputation;
  const potential = Math.max(
    0,
    Math.round(22 * thirst * today.trafficMod * repFactor * (0.88 + rng() * 0.24))
  );

  const stock = maxCupsAvailable(state.inventory, state.recipe);

  // What a passer-by would pay: better lemonade and hotter days raise it.
  const baseWillingness = (0.1 + 1.35 * quality + 0.7 * heat) * mods.willingness;

  let interested = 0;
  for (let i = 0; i < potential; i++) {
    // Spread of budgets across the crowd — some splurge, some are stingy.
    const personal = baseWillingness * (0.6 + rng() * 0.8);
    if (state.price <= personal) interested++;
  }

  const sold = Math.min(interested, stock);
  const lostToStockout = Math.max(0, interested - stock);
  const pitchersMade = Math.ceil(sold / CUPS_PER_PITCHER);

  // Enhancers are an independent upsell: every cup sold is offered whichever
  // ones are switched on and still in stock, and each customer decides for
  // themself — it never affects whether the base cup gets bought at all.
  const enhancerSales = {};
  let enhancerRevenue = 0;
  let enhancerCost = 0;
  for (const id of Object.keys(ENHANCERS)) {
    if (!state.enhancersOffered?.[id]) continue;
    let stockLeft = state.inventory.enhancers?.[id] || 0;
    if (stockLeft <= 0) continue;
    const enh = ENHANCERS[id];
    const uptake = enhancerUptake(enh, heat);
    let used = 0;
    for (let i = 0; i < sold && stockLeft > 0; i++) {
      if (rng() < uptake) {
        used++;
        stockLeft--;
      }
    }
    if (used > 0) {
      enhancerSales[id] = { cups: used, revenue: round2(used * enh.addPrice), cost: round2(used * enh.unitCost) };
      enhancerRevenue += used * enh.addPrice;
      enhancerCost += used * enh.unitCost;
    }
  }

  const used = {
    lemons: pitchersMade * state.recipe.lemons,
    sugar: pitchersMade * state.recipe.sugar,
    ice: sold * state.recipe.ice,
    cups: sold,
    enhancers: Object.fromEntries(Object.entries(enhancerSales).map(([id, s]) => [id, s.cups])),
  };
  const revenue = round2(sold * state.price + enhancerRevenue);
  const cogs = round2(
    pitchersMade * (state.recipe.lemons * today.prices.lemon + state.recipe.sugar * today.prices.sugar) +
    used.ice * today.prices.ice +
    used.cups * today.prices.cup +
    enhancerCost
  );

  // Reputation follows the drink first, then how you priced it. Word only
  // spreads through cups actually sold, and the last stretch to a perfect
  // reputation is the hardest to earn.
  const valueForMoney = clamp(baseWillingness - state.price, -1, 1);
  let repDelta;
  if (sold === 0) {
    repDelta = stock === 0 ? -0.01 : -0.02; // shut, or nobody bit at that price
  } else {
    repDelta = clamp(
      0.09 * (quality - 0.55) * 2 + 0.03 * valueForMoney - (lostToStockout > potential * 0.25 ? 0.03 : 0),
      -0.09,
      0.09
    );
    if (repDelta > 0) repDelta *= 1.6 * (1 - state.reputation);
  }
  repDelta *= mods.repSwing;

  const result = {
    day: state.day,
    weather: today.weather,
    temp: today.temp,
    event: today.event,
    potential,
    interested,
    sold,
    lostToStockout,
    stock,
    quality,
    price: state.price,
    revenue,
    rent: round2(mods.rent),
    cogs,
    profit: round2(revenue - cogs - mods.rent),
    used,
    enhancers: enhancerSales,
    enhancerRevenue: round2(enhancerRevenue),
    repDelta,
  };
  result.notes = customerNotes(state.recipe, today.temp, result, mods);
  return result;
}

/** Apply a simulated day to the state and move the calendar forward. */
function commitDay(state, result) {
  const days = state.days ?? TOTAL_DAYS;
  state.money = round2(state.money + result.revenue - (result.rent || 0));
  consumeLemons(state, result.used.lemons);
  state.inventory.sugar -= result.used.sugar;
  state.inventory.cups -= result.used.cups;
  for (const [id, qty] of Object.entries(result.used.enhancers || {})) {
    state.inventory.enhancers[id] = Math.max(0, (state.inventory.enhancers[id] || 0) - qty);
  }
  result.melted = Math.max(0, state.inventory.ice - result.used.ice);
  state.inventory.ice = 0; // whatever is left melts overnight
  state.reputation = clamp(state.reputation + result.repDelta, 0.05, 1);
  state.history.push(result);
  state.day += 1;
  result.spoiledLemons = spoilLemons(state); // checked as of the day that's about to start
  if (state.day > days) {
    state.phase = 'gameover';
  } else if (isBankrupt(state)) {
    state.bankrupt = true;
    state.phase = 'gameover';
  } else {
    state.today = rollDay(state);
    state.phase = 'forecast';
  }
  return state;
}

/**
 * Nothing left to pour and not enough cash for the cheapest possible pitcher
 * (one lemon, one spoon of sugar, one paper cup) at today's prices.
 */
function isBankrupt(state) {
  if (maxCupsAvailable(state.inventory, state.recipe) > 0) return false;
  const p = state.today.prices;
  const cheapestCup = p.lemon + p.sugar + p.cup;
  return state.money < cheapestCup;
}

function finalScore(state) {
  const totals = state.history.reduce(
    (acc, d) => {
      acc.revenue += d.revenue;
      acc.profit += d.profit;
      acc.sold += d.sold;
      acc.enhancerCups += Object.values(d.used?.enhancers || {}).reduce((a, b) => a + b, 0);
      acc.enhancerRevenue += d.enhancerRevenue || 0;
      return acc;
    },
    { revenue: 0, profit: 0, sold: 0, enhancerCups: 0, enhancerRevenue: 0 }
  );
  const best = state.history.reduce((a, b) => (b.profit > (a?.profit ?? -Infinity) ? b : a), null);
  const net = round2(state.money - state.stake);
  return {
    money: round2(state.money),
    net,
    revenue: round2(totals.revenue),
    profit: round2(totals.profit),
    cupsSold: totals.sold,
    enhancerCups: totals.enhancerCups,
    enhancerRevenue: round2(totals.enhancerRevenue),
    bestDay: best,
    reputation: state.reputation,
    target: state.target,
    won: state.target == null ? null : net >= state.target,
    rank: state.bankrupt ? { title: 'Out of Business', icon: '💸' } : rankFor(state.money),
    bankrupt: !!state.bankrupt,
  };
}

function rankFor(money) {
  if (money >= 350) return { title: 'Lemonade Tycoon', icon: '👑' };
  if (money >= 220) return { title: 'Franchise Owner', icon: '🏆' };
  if (money >= 120) return { title: 'Corner Champion', icon: '🥇' };
  if (money >= 60) return { title: 'Steady Squeezer', icon: '🍋' };
  if (money >= STARTING_MONEY) return { title: 'Broke Even', icon: '🙂' };
  return { title: 'Sour Season', icon: '😬' };
}

/* ------------------------------------------------------------------ *
 * Reference play
 *
 * A near-optimal bot used to set each corner's target ("par"). Because the
 * bot plays the corner's own weather, prices and modifiers, a target derived
 * from its result is calibrated to that corner automatically — a rainy city
 * with fussy customers gets an honestly lower bar than a tourist trap.
 * ------------------------------------------------------------------ */

/** What the crowd will pay on average today, for a given drink quality. */
function willingnessToday(state, quality) {
  const mods = withMods(state.mods);
  const heat = clamp((state.today.temp - 48) / 46, 0, 1);
  return (0.1 + 1.35 * quality + 0.7 * heat) * mods.willingness;
}

/**
 * Revenue-maximising price. Budgets are spread uniformly over 0.6–1.4× the
 * average, so the take is p·(1.4 − p/w)/0.8 and the peak sits at 0.7·w.
 */
function bestPrice(state, quality) {
  return Math.max(0.05, Math.round(0.7 * willingnessToday(state, quality) * 20) / 20);
}

/** Share of passers-by who would buy at `price` today. */
function demandShare(state, quality, price) {
  const w = willingnessToday(state, quality);
  return clamp((1.4 - price / w) / 0.8, 0, 1);
}

/** Roughly how many people will walk past today. */
function expectedTraffic(state) {
  const heat = clamp((state.today.temp - 48) / 46, 0, 1);
  const thirst = 0.35 + 1.25 * heat * heat;
  return 22 * thirst * state.today.trafficMod * (0.45 + 1.1 * state.reputation);
}

/** How the reference bot would play today: ideal recipe, best price, stock to match. */
function referencePlan(state) {
  const mods = withMods(state.mods);
  const recipe = { lemons: IDEAL_LEMONS, sugar: IDEAL_SUGAR, ice: idealIcePerCup(state.today.temp, mods) };
  const quality = recipeQuality(recipe, state.today.temp, mods);
  const price = bestPrice(state, quality);
  const expected = expectedTraffic(state) * demandShare(state, quality, price);
  return { recipe, price, cups: Math.max(0, Math.round(expected * 1.05)) };
}

/** Buy what's missing to pour `cups` cups, trimmed to what the money covers. */
function affordableOrder(state, recipe, cups) {
  const prices = state.today.prices;
  const need = (have, want) => Math.max(0, want - have);
  const orderFor = (n) => {
    const pitchers = Math.ceil(n / CUPS_PER_PITCHER);
    return {
      lemons: need(state.inventory.lemons, pitchers * recipe.lemons),
      sugar: need(state.inventory.sugar, pitchers * recipe.sugar),
      ice: need(state.inventory.ice, n * recipe.ice),
      cups: need(state.inventory.cups, n),
    };
  };
  if (buyCost(prices, orderFor(cups)) <= state.money) return orderFor(cups);
  let lo = 0;
  let hi = cups;
  while (lo < hi) {
    const mid = Math.ceil((lo + hi) / 2);
    if (buyCost(prices, orderFor(mid)) <= state.money) lo = mid;
    else hi = mid - 1;
  }
  return orderFor(lo);
}

/**
 * Play a whole run with the reference bot and report the profit it cleared.
 * This is what corner targets are measured against.
 */
function parProfit(config) {
  const state = newRun({ ...config, target: null });
  while (state.phase !== 'gameover') {

 * Enhancers are a deliberate, separate purchase — a stock-up preset for the

function orderFor(cups) {
  const r = run();
  const pitchers = Math.ceil(cups / S.CUPS_PER_PITCHER);
  const need = (have, want) => Math.max(0, want - have);
  return {
    lemons: need(r.inventory.lemons, pitchers * r.recipe.lemons),
    sugar: need(r.inventory.sugar, pitchers * r.recipe.sugar),
    ice: need(r.inventory.ice, cups * r.recipe.ice),
    cups: need(r.inventory.cups, cups),
    enhancers: store.ui.order.enhancers,
  };
}

/**

 * a whole order rather than trimmed line by line, so it stays balanced — no
 * paying for ice that melts before there is lemonade to put it in.
 */
function presetOrder(cups) {
  const r = run();
  const prices = r.today.prices;
  if (S.buyCost(prices, orderFor(cups)) <= r.money) {
    store.ui.order = orderFor(cups);
    return;
  }
  let lo = 0;
  let hi = cups;
  while (lo < hi) {
    const mid = Math.ceil((lo + hi) / 2);
    if (S.buyCost(prices, orderFor(mid)) <= r.money) lo = mid;
    else hi = mid - 1;
  }
  store.ui.order = orderFor(lo);
}

  store.ui.pending = null;
  store.ui.claimResult = null;
  store.ui.view = 'run';
}

function settleRun() {
  const r = run();
  if (!r.corner || r.settled) return [];
  r.settled = true;
  const score = S.finalScore(r);
  const campaign = store.campaign;
  campaign.stats.runsPlayed += 1;
  campaign.stats.cupsSold += score.cupsSold;

  if (score.won) {
    campaign.stats.runsWon += 1;
    store.ui.claimResult = C.claimCorner(campaign, r.corner.cityId, r.corner.index, score.net);
    if (store.ui.claimResult.opsJustUnlocked && !campaign.ops) campaign.ops = newOps();
  }
  if (campaign.ops) {
    const summary = tickOps(campaign, r.history.length);
    store.ui.opsReport = summary && summary.days > 0 ? summary : null;
  }
  const cleanRunFinished = r.history.every((d) => !(d.spoiledLemons > 0));
  return checkAchievements({ cleanRunFinished });
